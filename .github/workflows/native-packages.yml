name: RC6 Linux candidate build
on:
  push:
    branches: [rc6/linux-release]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rc6-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REMOTE_EXECUTION: DISABLED
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
      - name: Native Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-pip python3-cryptography libgomp1 xvfb
      - name: Source privacy, exact RC6 source correlation and documentation
        run: python -B packaging/validate_rc5.py
      - name: Build only from the curated clean checkout
        run: python -B packaging/build.py
      - name: Actual Linux payload, inclusion, privacy and offline startup
        run: xvfb-run -a /usr/bin/python3 -B packaging/rc5_smoke.py
      - name: Curated source archive
        run: python -B packaging/source_archive.py
      - name: Final Linux and source hashes
        run: python -B packaging/finalize_candidate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rc6-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14
