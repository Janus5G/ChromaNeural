name: RC5 clean candidate build and optional TEST signing
on:
  push:
    branches: [rc5/preparation]
  workflow_dispatch:
    inputs:
      test_sign:
        description: Request the existing SignPath TEST policy after clean Windows acceptance
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: rc5-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REMOTE_EXECUTION: DISABLED
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
      - name: Native Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-cryptography nodejs libgomp1 xvfb
      - name: Install hash-locked official Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/install-inno-tool.ps1
      - name: Source privacy, application correlation and documentation acceptance
        run: python -B packaging/validate_rc5.py
      - name: Build only from the curated checkout
        run: python -B packaging/build.py
      - name: Windows isolated install, startup, reinstall and uninstall
        if: runner.os == 'Windows'
        run: python -B packaging/rc5_smoke.py
      - name: Linux extracted package and startup
        if: runner.os == 'Linux'
        run: xvfb-run -a /usr/bin/python3 -B packaging/rc5_smoke.py
      - name: Curated source archive
        if: runner.os == 'Windows'
        run: python -B packaging/source_archive.py
      - name: Final unsigned artifact manifest
        run: python -B packaging/finalize_candidate.py
      - name: Unsigned Windows verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $s=Get-AuthenticodeSignature -LiteralPath dist/ChromaNeural-0.2.21-rc.5-windows-x64.exe
          if($s.Status -ne 'NotSigned'){throw 'Unexpected pre-signing signature state'}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rc5-unsigned-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  test-sign:
    if: inputs.test_sign
    needs: package
    runs-on: windows-2025
    environment: rc5-signing-test
    timeout-minutes: 20
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_TEST_POLICY_SLUG: ${{ vars.SIGNPATH_TEST_POLICY_SLUG }}
      SIGNPATH_TEST_CERT_SHA256: ${{ vars.SIGNPATH_TEST_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Fail closed on missing existing-account configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          foreach($name in @('SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_ARTIFACT_CONFIGURATION_SLUG','SIGNPATH_TEST_POLICY_SLUG','SIGNPATH_TEST_CERT_SHA256','SIGNPATH_API_TOKEN')) {
            if(-not [Environment]::GetEnvironmentVariable($name)){throw "Missing required signing configuration: $name"}
          }
      - name: Retrieve this run's accepted unsigned Windows artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name rc5-unsigned-windows-x64 --dir unsigned
      - name: Upload raw PE for the existing PE artifact configuration
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: unsigned/ChromaNeural-0.2.21-rc.5-windows-x64.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Existing SignPath TEST policy only
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_TEST_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: signed-test
      - name: Validate returned Authenticode certificate and calculate final SHA-256
        shell: pwsh
        run: ./packaging/windows/verify-signature.ps1 -Artifact signed-test/ChromaNeural-0.2.21-rc.5-windows-x64.exe -TestCertificate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc5-TEST-signed-NOT-FOR-PUBLIC-RELEASE
          path: signed-test/
          if-no-files-found: error
          retention-days: 14
